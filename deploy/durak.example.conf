# Альтернативный вариант HTTPS, если на сервере уже крутится общий nginx
# (и 80/443 заняты другими проектами). Подходит для серверов с "timeline" и др.
#
# 1) В docker-compose.yml убери сервис caddy, оставь только durak
#    и раскомментируй:  ports: - "18080:8080"
# 2) Скопируй этот файл на сервер:
#      cp deploy/durak.example.conf /etc/nginx/sites-available/durak.example.com
#      ln -s /etc/nginx/sites-available/durak.example.com /etc/nginx/sites-enabled/
#    (замени durak.example.com на свой поддомен)
# 3) Выпусти сертификат:
#      apt install -y certbot python3-certbot-nginx
#      certbot --nginx -d durak.example.com
# 4) nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name durak.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name durak.example.com;

    ssl_certificate     /etc/letsencrypt/live/durak.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/durak.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
