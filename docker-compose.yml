# Серверная версия: HTTPS обеспечивает хост-прокси (см. deploy/).
# Порты 80/443 на сервере заняты xray-VPN, поэтому наружу торчит только 127.0.0.1:18080.
services:
  durak:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:18080:8080"
    env_file: .env.prod
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      WALLET_DB: /app/data/wallets.db
    volumes:
      - durak_data:/app/data

volumes:
  durak_data:
